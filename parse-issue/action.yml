name: "openFPGA Toolkit: Parse Issue"
description: "Parses issue forms."
author: "Joshua Campbell"
inputs:
  issue:
    description: "The body of the issue to be parsed."
    required: true
  template-path:
    description: "The path to the issue form template used to create the issue."
    required: false
outputs:
  issue:
    description: "The parsed issue data."
runs:
  using: node24
  main: "../lib/parse-issue-entry.js"
