name: Download File

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Download File
        uses: ./../download-file
        with:
          repository: "spacemen3/PDP-1"
          output-path: "${{ runner.temp }}/core.zip"
