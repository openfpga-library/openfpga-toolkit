name: Validate on Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  process_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue
        id: parse-issue
        uses: ./parse-issue
        with:
          issue: "${{ github.event.issue.body }}"
          template-path: ".github/ISSUE_TEMPLATE/validate-core.yml"

      - name: Download Core
        id: download-file
        uses: ./download-file
        with:
          repository: "${{ fromJSON(steps.parse-issue.outputs.issue).repository }}"
          asset-filter: "${{ fromJSON(steps.parse-issue.outputs.issue).asset-filter }}"
          content-path: "${{ fromJSON(steps.parse-issue.outputs.issue).content-path }}"

      - name: Validate Core
        uses: ./validate-core
        with:
          zip-path: "${{ steps.download-file.outputs.file-path }}"

      - name: Create PR Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Thank you for your contribution!

            Unfortunately, the validation of the core has failed. Please check the [details](${runUrl}) and try again.

            If you believe this is an error, feel free to reach out for support.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

      - name: Close Issue
        if: ${{ !cancelled() }}
        run: gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
