name: New Core Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  process_issue:
    if: contains(github.event.issue.labels.*.name, 'new core')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue
        id: parse-issue
        uses: ./parse-issue
        with:
          issue: "${{ github.event.issue.body }}"
          template-path: ".github/ISSUE_TEMPLATE/new-core.yml"

      - name: Download Core
        id: download-file
        uses: ./download-file
        with:
          repository: "${{ fromJSON(steps.parse-issue.outputs.issue).repository }}"
          asset-filter: "${{ fromJSON(steps.parse-issue.outputs.issue).asset-filter }}"
          content-path: "${{ fromJSON(steps.parse-issue.outputs.issue).content-path }}"

      - name: Validate Core
        uses: ./validate-core
        with:
          zip-path: "${{ steps.download-file.outputs.file-path }}"

      - name: Add Issue Comment
        if: failure()
        run: gh issue comment "$NUMBER" --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: |
            Thank you for your contribution!

            Unfortunately, the validation of the core has failed. Please check the [details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and try again.

            If you believe this is an error, feel free to reach out for support.

      - name: Close Issue
        if: ${{ !cancelled() }}
        run: gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
