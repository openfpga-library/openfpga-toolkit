name: Download & Validate

on:
  workflow_dispatch:

jobs:
  download-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download Core
        id: download-core
        uses: ./download-file
        with:
          repository: "spacemen3/PDP-1"
      - name: Validate Core
        uses: ./validate-core
        with:
          zip-path: "${{ steps.download-core.outputs.file-path }}"
